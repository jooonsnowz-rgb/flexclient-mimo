name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip
          sudo wget -q -O /usr/local/bin/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          sudo wget -q -O /usr/local/bin/apktool \
            https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Install Android cmdline-tools + build-tools
        run: |
          ANDROID_HOME="${{ github.workspace }}/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Build unsigned APK with apktool
        run: |
          mkdir -p dist
          apktool b app -o dist/mimo-unsigned.apk
          ls -lh dist/mimo-unsigned.apk

      - name: Zipalign + sign APK
        run: |
          zipalign -f -p 4 dist/mimo-unsigned.apk dist/mimo-aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out dist/Mimo-FlexClient.apk \
            dist/mimo-aligned.apk
          apksigner verify --verbose dist/Mimo-FlexClient.apk
          ls -lh dist/Mimo-FlexClient.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mimo-FlexClient
          path: dist/Mimo-FlexClient.apk
          if-no-files-found: error
